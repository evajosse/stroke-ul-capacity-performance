# ------------------------------
# Manuscript 1 – Configuration
# ------------------------------

[Path_raw_data]
home_path_to_data = /path/to/data/
folder_clinical_data = Clinical_data/
redcap_table_filename = raw_redcap.xlsx
folder_imu_data = IMU_data/

[Path_additional_info]
full_path_to_def_of_all_vars = metadata/variables_definitions.xlsx
full_path_to_database_protocol = metadata/protocol.xlsx
full_path_to_redcap_data_corrections = metadata/redcap_corrections.xlsx
full_path_time_point_completion_imu = metadata/Timepoint_completion_imu.xlsx

[Path_processed_data]
path_to_fig = ./fig/manuscript1/
path_corrected_redcap_data = redcap_corrected.csv
path_formatted_redcap_data = redcap_IMU_merged.csv

[Variables_manuscript1]
var_of_interest = arm_use_ratio_VQF
time_col = Days_post_stroke_tech
required_time_points = 0,5
scale_factor_time = 30
grouping_var = ID
time_points_col = Tj

# Bounds for clinically meaningful predicted outcomes in simulations
lower_bound_arm_use_ratio_VQF = 0
upper_bound_arm_use_ratio_VQF = 2
lower_bound_relative_duration_use_VQF_impaired = 0
upper_bound_relative_duration_use_VQF_impaired = 1
lower_bound_average_intensity_active_VQF_impaired = 0
upper_bound_average_intensity_active_VQF_impaired = 
lower_bound_average_UL_activity_VQF_impaired = 0
upper_bound_average_UL_activity_VQF_impaired = 
rounds_outcome = False

# Model structures 
model_name = linear_log_time
fixed_effects_structure = log1p_time_c
random_effects_structure = 1 + log1p_time_c

# Visualization
color = tab:orange
category = P

# Potential predictors
binary_predictors = MEP_is_negative, impaired_hand_is_dominant
nominal_predictors = nat_str,
continuous_predictors = arat_tot, fma_total, grstr_mean_impaired, safe_tot1, moca_tot, age, inpatient_duration, relative_duration_use_VQF_impaired, average_intensity_active_VQF_impaired, average_UL_activity_VQF_impaired, mas_sh, mas_bi, mas_wri, mas_fin,  
target_k = 3 